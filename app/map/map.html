<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenith: click anywhere on Earth</title>
<style>
  :root { --bg:#0b0f17; --panel:#141a26; --line:#263043; --text:#e6ebf4; --dim:#93a0b8; --accent:#6ea8fe; --warn:#e5a43b; --bad:#e5604d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:16px 22px 10px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:12px 24px; align-items:end; }
  h1 { margin:0; font-size:21px; }
  header p { margin:2px 0 0; color:var(--dim); font-size:14px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-left:auto; }
  select, input, button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:6px 9px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  label.chk { display:flex; gap:6px; align-items:center; color:var(--dim); font-size:14px; }
  main { display:grid; grid-template-columns:minmax(0, 1fr) 400px; gap:16px; padding:14px 22px 30px; align-items:start; }
  @media (max-width:1100px) { main { grid-template-columns:1fr; } }
  .mapwrap { position:relative; background:#06080d; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  canvas { display:block; width:100%; height:auto; cursor:crosshair; image-rendering:pixelated; }
  #marker { position:absolute; width:16px; height:16px; margin:-8px 0 0 -8px; border:2px solid #fff; border-radius:50%; box-shadow:0 0 0 2px rgba(0,0,0,.6); pointer-events:none; display:none; }
  #hover { position:absolute; left:8px; bottom:8px; background:rgba(11,15,23,.85); padding:3px 8px; border-radius:6px; font-size:12.5px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .legend { display:flex; align-items:center; gap:8px; padding:8px 2px 0; color:var(--dim); font-size:12.5px; flex-wrap:wrap; }
  .ramp { width:180px; height:10px; border-radius:5px; }
  .sw { display:inline-block; width:12px; height:10px; border-radius:2px; vertical-align:middle; margin-right:4px; }
  .quick { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .quick button { font-size:13px; padding:4px 9px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  h2 { margin:0 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); font-weight:600; }
  h3 { margin:14px 0 6px; font-size:14px; }
  .place { font-size:17px; font-weight:600; }
  .note { color:var(--dim); font-size:12.5px; margin:6px 0 0; }
  .tgt { border:1px solid var(--line); border-radius:8px; padding:9px 11px; margin-bottom:7px; }
  .tgt.out { opacity:.6; }
  .tgt .top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .tgt .score { font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; }
  .tgt small { color:var(--dim); display:block; }
  .bar { display:grid; grid-template-columns:118px 1fr 34px; gap:7px; align-items:center; margin:3px 0; font-size:12.5px; }
  .track { height:8px; background:#0d121c; border:1px solid var(--line); border-radius:5px; overflow:hidden; }
  .track i { display:block; height:100%; background:var(--accent); }
  .bar .v { text-align:right; color:var(--dim); font-variant-numeric:tabular-nums; }
  .bar.cant span:first-child { color:var(--bad); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td { padding:3px 4px; border-bottom:1px solid var(--line); }
  td.n { text-align:right; font-variant-numeric:tabular-nums; }
  .warn { color:var(--warn); }
  #status { color:var(--dim); padding:40px; text-align:center; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Click anywhere on Earth</h1>
    <p>Zenith scores the spot you click against seven Moon and Mars base sites, live in your browser. Data v1.6.</p>
  </div>
  <div class="controls">
    <label>Map colour <select id="target"></select></label>
    <label class="chk"><input type="checkbox" id="et"> Earth-testable score</label>
    <input id="coord" placeholder="lat, lon (e.g. -24.1, -70)" size="22">
    <button id="go">Go</button>
  </div>
</header>
<main>
  <div>
    <div class="mapwrap" id="mapwrap">
      <canvas id="map" width="1440" height="720"></canvas>
      <div id="marker"></div>
      <div id="hover"></div>
    </div>
    <div class="legend">
      <span>low</span><canvas class="ramp" id="ramp" width="180" height="10"></canvas><span>high match</span>
      <span style="margin-left:14px"><span class="sw" style="background:#2a3142"></span>land not scored (vegetated, wet or ice)</span>
    </div>
    <div class="quick" id="quick"></div>
  </div>
  <section id="panel"><div id="status">Loading Earth data (about 8 MB)…</div></section>
</main>

<script src="zenith-engine.js"></script>
<script>
(function () {
  var PLACES = [
    ['Yungay, Atacama', -24.1, -70.0], ['NW Saudi lava field', 27.375, 37.375], ['Southern Taklamakan', 37.875, 83.375],
    ['McMurdo Dry Valleys', -77.5, 162.0], ['Qaidam Basin', 38.875, 95.125], ['Iceland highlands', 64.9, -16.8],
    ['Sahara, Egypt', 22.625, 31.875], ['Heilbronn', 49.14, 9.22]
  ];
  var eng, scores, cells, ctx = document.getElementById('map').getContext('2d');
  var W = 1440, H = 720, state = { target: 'best', et: false, sel: null };

  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function fmt(x, d) { return x === null || x === undefined || isNaN(x) ? 'n/a' : x.toFixed(d); }
  function coord(lat, lon) { return Math.abs(lat).toFixed(2) + '°' + (lat >= 0 ? 'N' : 'S') + ', ' + Math.abs(lon).toFixed(2) + '°' + (lon >= 0 ? 'E' : 'W'); }

  // perceptual blue to yellow ramp (viridis-like stops)
  var STOPS = [[0,[68,1,84]],[0.25,[59,82,139]],[0.5,[33,145,140]],[0.75,[94,201,98]],[1,[253,231,37]]];
  function ramp(t) {
    t = Math.max(0, Math.min(1, t));
    for (var k = 1; k < STOPS.length; k++) if (t <= STOPS[k][0]) {
      var a = STOPS[k-1], b = STOPS[k], u = (t - a[0]) / (b[0] - a[0]);
      return [0,1,2].map(function (j) { return Math.round(a[1][j] + u * (b[1][j] - a[1][j])); });
    }
    return STOPS[STOPS.length-1][1];
  }
  (function () { var r = el('ramp').getContext('2d'); for (var x = 0; x < 180; x++) { var c = ramp(x / 179); r.fillStyle = 'rgb(' + c + ')'; r.fillRect(x, 0, 1, 10); } })();

  function draw() {
    scores = eng.scoreAll(state.target, { earthTestable: state.et });
    var lo = Infinity, hi = -Infinity;
    for (var i = 0; i < scores.length; i++) if (!isNaN(scores[i])) { if (scores[i] < lo) lo = scores[i]; if (scores[i] > hi) hi = scores[i]; }
    var img = ctx.createImageData(W, H), d = img.data;
    for (var p = 0; p < d.length; p += 4) { d[p] = 6; d[p+1] = 8; d[p+2] = 13; d[p+3] = 255; }
    for (var i = 0; i < eng.n; i++) {
      var o = (eng.row[i] * W + eng.col[i]) * 4, s = scores[i], c;
      if (isNaN(s)) c = [42, 49, 66];
      else c = ramp((s - lo) / (hi - lo || 1));
      d[o] = c[0]; d[o+1] = c[1]; d[o+2] = c[2];
    }
    ctx.putImageData(img, 0, 0);
  }

  function place(lat, lon) {
    var x = (lon + 180) / 360 * 100, y = (90 - lat) / 180 * 100, m = el('marker');
    m.style.left = x + '%'; m.style.top = y + '%'; m.style.display = 'block';
  }

  function show(lat, lon, label) {
    state.sel = [lat, lon]; place(lat, lon);
    var r = eng.scoreAt(lat, lon), h = '';
    if (r.land) r.targets.sort(function (a, b) {
      if (a.eligible !== b.eligible) return a.eligible ? -1 : 1;
      return ((state.et ? b.earthTestableScore : b.score) || 0) - ((state.et ? a.earthTestableScore : a.score) || 0);
    });
    h += '<h2>Selected spot</h2><div class="place">' + esc(label || coord(lat, lon)) + '</div>';
    if (!r.land) { el('panel').innerHTML = h + '<p class="note">' + esc(r.message) + '</p>'; return; }
    var f = r.features;
    h += '<p class="note">Cell ' + coord(r.cellLat, r.cellLon) + ' (28 km square) · rock: ' + esc(f.rock) + (f.impact_crater ? ' · impact crater in this cell' : '') + '</p>';
    var anyEligible = r.targets.some(function (t) { return t.eligible; });
    if (!anyEligible) h += '<p class="note warn">This spot is filtered out for every target: ' + esc(r.targets[0].ineligibleReason) + '. Scores below show how close it would be anyway.</p>';
    h += '<h3>Match against each Moon and Mars site</h3>';
    r.targets.forEach(function (t, k) {
      var sc = state.et ? t.earthTestableScore : t.score, pc = state.et ? t.earthTestablePercentile : t.percentile;
      h += '<div class="tgt' + (t.eligible ? '' : ' out') + '"><div class="top"><span><b>' + esc(t.name) + '</b> <small>' + esc(t.body) +
        (t.eligible ? ' · better than ' + fmt(pc, 1) + '% of ' + t.nEligible.toLocaleString('en') + ' scored cells' : ' · not scored: ' + esc(t.ineligibleReason)) +
        '</small></span><span class="score">' + fmt(sc, 2) + '</span></div>';
      if (k < 3) {
        eng.params.dims.forEach(function (d) {
          var cant = t.notTestableOnEarth.indexOf(d) >= 0, v = t.dims[d];
          h += '<div class="bar' + (cant ? ' cant' : '') + '"><span>' + esc(eng.dimLabel(d)) + (cant ? ' *' : '') + '</span><span class="track"><i style="width:' + ((v || 0) * 100) + '%"></i></span><span class="v">' + fmt(v, 2) + '</span></div>';
        });
      }
      h += '</div>';
    });
    h += '<p class="note">Score 1 = identical twin. Agencies\' own analog sites score about 0.4 to 0.65 for their targets on this scale. * = out of Earth\'s reach for this target (left out of the Earth-testable score). Gravity, vacuum or thin atmosphere, and radiation can\'t be tested anywhere on Earth.</p>';
    h += '<h3>This cell\'s data</h3><table><tbody>' + [
      ['Coldest monthly night', fmt(f.temp_min_K, 0) + ' K'], ['Day/night swing', fmt(f.temp_daynight_range_K, 1) + ' K'],
      ['Rain', fmt(f.precip_mm_per_yr, 0) + ' mm/yr'], ['Mean slope', fmt(f.slope_deg, 2) + '°'], ['Roughness (TRI)', fmt(f.roughness_tri_m, 0) + ' m'],
      ['Albedo', fmt(f.albedo_wsa_unitless, 2)], ['Ice at or near the surface', fmt(f.ground_ice_frac, 2)], ['Mean noon sun', fmt(f.sun_noon_elev_mean_deg, 1) + '°'],
      ['Bare ground', fmt(f.barren_pct, 0) + '%'], ['Max NDVI (vegetation)', fmt(f.ndvi_max_unitless, 2)]
    ].map(function (x) { return '<tr><td>' + x[0] + '</td><td class="n">' + x[1] + '</td></tr>'; }).join('') + '</tbody></table>';
    h += '<p class="note">Sources: NASA MODIS, GPM IMERG, NASA POWER, NOAA ETOPO 2022, GLiM rock map, ESA CCI permafrost. Targets: LRO LOLA and Diviner, MGS MOLA, Mars Climate Database.</p>';
    el('panel').innerHTML = h;
  }

  function onCanvas(ev, fn) {
    var c = ev.target.getBoundingClientRect(), x = (ev.clientX - c.left) / c.width, y = (ev.clientY - c.top) / c.height;
    fn(90 - y * 180, x * 360 - 180);
  }

  ZenithEngine.load('.').then(function (e) {
    eng = e;
    var sel = el('target');
    sel.innerHTML = '<option value="best">Best match of all seven</option>' + eng.targets.map(function (t) { return '<option value="' + t.id + '">' + esc(t.name) + ' (' + t.body + ')</option>'; }).join('');
    el('quick').innerHTML = PLACES.map(function (p, k) { return '<button data-k="' + k + '">' + esc(p[0]) + '</button>'; }).join('');
    draw();
    show(PLACES[0][1], PLACES[0][2], PLACES[0][0]);
  }).catch(function (err) {
    el('panel').innerHTML = '<div id="status">Could not load the data: ' + esc(err.message) + '.<br>Open this page through a web server (for example <code>python3 -m http.server</code> in this folder), not by double-clicking the file.</div>';
  });

  el('map').addEventListener('click', function (ev) { onCanvas(ev, function (lat, lon) { show(lat, lon); }); });
  el('map').addEventListener('mousemove', function (ev) { onCanvas(ev, function (lat, lon) { el('hover').textContent = coord(lat, lon); }); });
  el('target').addEventListener('change', function (ev) { state.target = ev.target.value; draw(); });
  el('et').addEventListener('change', function (ev) { state.et = ev.target.checked; draw(); if (state.sel) show(state.sel[0], state.sel[1]); });
  el('quick').addEventListener('click', function (ev) { var b = ev.target.closest('button'); if (!b) return; var p = PLACES[+b.dataset.k]; show(p[1], p[2], p[0]); });
  function go() { var m = el('coord').value.split(/[,\s]+/).map(Number); if (m.length >= 2 && !isNaN(m[0]) && !isNaN(m[1])) show(m[0], m[1]); }
  el('go').addEventListener('click', go);
  el('coord').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go(); });
})();
</script>
</body>
</html>
