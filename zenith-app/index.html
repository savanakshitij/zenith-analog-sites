<!doctype html>
<html lang="en" data-look="night" data-font="inter">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Zenith</title>
  <meta name="description" content="Search a Moon or Mars mission. Zenith flies to the place on Earth where it can be rehearsed. NASA Space Apps 2026, Team Zenith.">
  <!-- Inter is the default font. The other Design-menu fonts (and css/fonts.css) are added by js/design.js the first time they can be seen. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/sonify.css">
</head>
<body class="is-home">
  <canvas id="stars" aria-hidden="true"></canvas>
  <canvas id="earth" aria-hidden="true"></canvas>
  <canvas id="globe" aria-label="Globe of Earth"></canvas>

  <!-- Cinematic flight: letterbox bars and a location title card -->
  <div class="cine-bar top" aria-hidden="true"></div>
  <div class="cine-bar bottom" aria-hidden="true"></div>
  <p class="cine-card" aria-hidden="true"><span id="cEyebrow"></span><b id="cName"></b><span id="cCoord"></span></p>

  <a class="brand" href="./" aria-label="Zenith home"><i aria-hidden="true"></i>ZENITH</a>
  <p class="foot">Built for the <b>NASA Space Apps Challenge 2026</b> · Team Zenith</p>

  <form id="search" class="search" role="search" autocomplete="off">
    <label for="q" class="sr">Search a mission</label>
    <input id="q" type="search" placeholder="Search a Moon or Mars mission" aria-controls="suggest">
    <button type="submit" aria-label="Search">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <ul id="suggest" class="suggest" role="listbox" hidden></ul>
  </form>

  <section id="result" class="result" hidden aria-live="polite">
    <header class="r-head">
      <div class="r-title">
        <p id="rTarget" class="r-target"></p>
        <h1 id="rName"></h1>
        <p id="rWhere" class="r-where"></p>
      </div>
      <div class="r-score"><span id="rPct">0</span><small>% match</small></div>
    </header>
    <div class="r-nav">
      <button id="prev" class="step" aria-label="Previous site">‹</button>
      <span id="rRank"></span>
      <button id="next" class="step" aria-label="Next site">›</button>
      <span id="rBadges" class="r-badges"></span>
    </div>
    <div id="slideBar" class="slide-bar"></div>
    <div id="panel" class="deck" tabindex="0" aria-label="Fact cards: swipe a card away to see the next, or use the arrow keys"></div>
  </section>

  <script src="js/vendor/d3.min.js"></script>
  <script src="js/vendor/topojson-client.min.js"></script>
  <script src="js/vendor/countries-110m.js"></script>
  <script src="js/earth-textures.js"></script>
  <script src="data/zenith-data.js"></script>
  <!-- The mission-coverage engine the app runs on. The team's own coverage.js reports a different data shape, so it
       cannot just be dropped in: to use it, adapt its output in runEngine() in js/app.js. -->
  <script src="js/coverage-stub.js"></script>
  <script src="js/mission.js"></script>
  <script src="js/features.js"></script>
  <script src="js/globe.js"></script>
  <!-- three.js is deferred so the globe and search start without waiting for it; js/ground.js builds the 3D view once it has loaded -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/ground.js"></script>
  <script src="js/sonify-core.js"></script>
  <script src="js/sonify.js"></script>
  <script src="js/app.js"></script>
  <script src="js/design.js"></script>
</body>
</html>
